<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPU Shift Dashboard</title>

<style>
body { font-family: Arial; margin:0; background:#eef1f5; font-size:14px; }

.header {
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:15px 8px;
}

.logo {
    width:45px;
    border-radius:12px;
    border:2px solid white;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
}

.badge {
    display:inline-block;
    background:#c2185b;
    padding:5px 12px;
    border-radius:20px;
    margin:6px 0;
    font-weight:bold;
}

.sub-info { font-size:13px; }

.card {
    background:white;
    margin:10px;
    padding:12px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

select, button, input {
    width:100%;
    padding:8px;
    margin-top:6px;
    border-radius:6px;
    border:1px solid #ccc;
}

button {
    background:#1f4e79;
    color:white;
    border:none;
}

.shift-title { font-weight:bold; margin-top:10px; }

.chip {
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    color:white;
    margin:3px;
    font-size:12px;
}

.selected {
    border:2px solid gold;
    box-shadow:0 0 5px gold;
}

/* COLORS */
.A { background:#8e24aa; }
.B { background:#fb8c00; }
.C { background:#1e88e5; }
.G { background:#e53935; }
.OFF { background:#2e7d32; }

.D { background:#6d4c41; }
.N { background:#3949ab; }
.L { background:#00897b; }
.T { background:#f4511e; }

hr { margin:10px 0; }

</style>
</head>

<body>

<div class="header">
    <img src="https://raw.githubusercontent.com/debajitd1292/pp/main/logo.png" class="logo">
    <h3>PPU Shift Schedule</h3>
    <div id="todayDate"></div>
    <div class="badge" id="todayShiftBadge">Loading...</div>
    <div class="sub-info">
        Next GH: <span id="nextGH">-</span> |
        Next RH: <span id="nextRH">-</span>
    </div>
</div>

<div class="card">
    <label>Select Date:</label>
    <input type="date" id="datePicker" onchange="renderSelected()">

    <label>Your Name:</label>
    <select id="nameSelector" onchange="onNameChange()"></select>

    <label>Override For:</label>
    <select id="overrideName"></select>

    <label>Override Shift:</label>
    <select id="shiftOverride">
        <option value="">--None--</option>
        <option>A</option><option>B</option><option>C</option>
        <option>G</option><option>OFF</option>
        <option>D</option><option>N</option>
        <option>L</option><option>T</option>
    </select>

    <button onclick="applyOverride()">Apply Override</button>
</div>

<div class="card">
    <h3>TODAY</h3>
    <div id="today"></div>
</div>

<div class="card">
    <h3>SELECTED</h3>
    <div id="selected"></div>
</div>

<script>

const shiftUrl = "https://raw.githubusercontent.com/debajitd1292/pp/main/shift.csv";
const holidayUrl = "https://raw.githubusercontent.com/debajitd1292/pp/main/holiday.csv";

let data = [];
let holidays = [];
let selectedName = "";
let overrides = {};

const seniorityOrder = [
"Saiprasad","Abhigyan","Arshad","Sandip","Shashank","Debajit",
"Satadru","Santanu","Arka","Devendra","Kamal","Vijay","Palash",
"Nihal","Sampreeti","Arun","Jitu","Pritam","Hriday"
];

const shiftLabels = {
    "A": "A Shift",
    "B": "B Shift",
    "C": "C Shift",
    "G": "G Shift",
    "OFF": "OFF",
    "D": "Day Duty",
    "N": "Night Duty",
    "L": "Leave",
    "T": "Training / Tour"
};

Promise.all([
    fetch(shiftUrl).then(r => r.text()),
    fetch(holidayUrl).then(r => r.text())
]).then(([shiftText, holidayText]) => {

    data = shiftText.split("\n").map(r => r.replace(/\r/g,"").split(/[,;]/));

    holidays = holidayText.split("\n").slice(1).map(r => {
        let [d,t,n] = r.replace(/\r/g,"").split(/[,;]/);
        return { date:d?.trim(), type:t?.trim().toUpperCase(), name:n?.trim() };
    });

    holidays.sort((a,b)=>{
        let [d1,m1,y1]=a.date.split("-");
        let [d2,m2,y2]=b.date.split("-");
        return new Date(`${y1}-${m1}-${d1}`) - new Date(`${y2}-${m2}-${d2}`);
    });

    init();
});

function formatDate(date){
    return ("0"+date.getDate()).slice(-2)+"-"+("0"+(date.getMonth()+1)).slice(-2)+"-"+date.getFullYear();
}

function init(){
    document.getElementById("todayDate").innerText = new Date().toDateString();
    populateNames();
    refreshUI();
    calculateNextHoliday(formatDate(new Date()));
}

function populateNames(){

    let nameSel = document.getElementById("nameSelector");
    let overrideSel = document.getElementById("overrideName");

    let prev = selectedName;

    nameSel.innerHTML="";
    overrideSel.innerHTML="";

    let names = [];

    for(let i=1;i<data.length;i++){
        let n = data[i][0]?.trim();
        if(n) names.push(n);
    }

    names = sortBySeniority(names);

    names.forEach(n=>{
        nameSel.add(new Option(n,n));
        overrideSel.add(new Option(n,n));
    });

    if(prev && names.includes(prev)){
        selectedName = prev;
        nameSel.value = prev;
        overrideSel.value = prev;
    } else {
        selectedName = nameSel.value;
        overrideSel.value = selectedName;
    }
}

function sortBySeniority(names){
    return names.sort((a,b)=>{
        let ia = seniorityOrder.indexOf(a); if(ia==-1) ia=999;
        let ib = seniorityOrder.indexOf(b); if(ib==-1) ib=999;
        return ia-ib;
    });
}

function refreshUI(){

    let todayStr = formatDate(new Date());
    let shift = getShiftForName(todayStr, selectedName);

    document.getElementById("todayShiftBadge").innerText =
        "Today Shift: " + (shift || "-");

    render("today", todayStr);

    if(document.getElementById("datePicker").value){
        renderSelected();
    }
}

function getShiftForName(dateStr,name){

    let key = dateStr+"|"+name;
    if(overrides[key]) return overrides[key];

    let header = data[0].map(x=>x.trim());
    let col = header.indexOf(dateStr);

    for(let i=1;i<data.length;i++){
        if(data[i][0]?.trim()===name){
            return data[i][col]?.trim();
        }
    }
}

function getShiftData(dateStr){

    let header = data[0].map(x=>x.trim());
    let col = header.indexOf(dateStr);
    if(col===-1) return null;

    let shifts={};

    for(let i=1;i<data.length;i++){

        let name=data[i][0]?.trim();
        let shift=data[i][col]?.trim();

        if(!shift) continue;

        let key=dateStr+"|"+name;
        if(overrides[key]) shift=overrides[key];

        let list = shift.split("");

        list.forEach(s=>{
            if(!shifts[s]) shifts[s]=[];
            shifts[s].push({ name:name, multi: shift.length>1 });
        });
    }
    return shifts;
}

function render(id,dateStr){

    let container=document.getElementById(id);
    container.innerHTML="";

    let shifts=getShiftData(dateStr);
    if(!shifts){ container.innerHTML="No Data"; return; }

    ["A","B","C","G","OFF","D","N","L","T"].forEach(s=>{

        let list = shifts[s] || [];
        let names = list.map(x=>x.name);
        names = sortBySeniority(names);

        let sortedList = names.map(n => list.find(x=>x.name===n));

        container.innerHTML += createBlock(s,sortedList,s);
    });
}

function createBlock(title,list,cls){

    let count=list.length;

    let alert = (["A","B","C"].includes(title) && count<=2) ? " ❗" : "";

    let chips=list.map(obj=>{
        let sel=(obj.name===selectedName)?"selected":"";
        let multi=obj.multi?" ❕":"";
        return `<span class="chip ${cls} ${sel}">${obj.name}${multi}</span>`;
    }).join("");

    let label = shiftLabels[title] || title;

    return `<div class="shift-title">${label} (${count})${alert}</div>${chips||"-"}`;
}

function onNameChange(){
    selectedName=document.getElementById("nameSelector").value;
    document.getElementById("overrideName").value=selectedName;
    refreshUI();
}

function applyOverride(){

    let name=document.getElementById("overrideName").value;
    let shift=document.getElementById("shiftOverride").value;
    if(!name||!shift) return;

    let dateInput=document.getElementById("datePicker").value;
    let dateStr = dateInput ? formatDate(new Date(dateInput)) : formatDate(new Date());

    overrides[dateStr+"|"+name]=shift;

    refreshUI();
}

function renderSelected(){
    let val=document.getElementById("datePicker").value;
    if(!val) return;
    render("selected", formatDate(new Date(val)));
}

function calculateNextHoliday(todayStr){

    let [d,m,y]=todayStr.split("-");
    let today=new Date(`${y}-${m}-${d}`);

    let nextGH=null,nextRH=null;

    holidays.forEach(h=>{
        if(!h.date) return;

        let [dd,mm,yy]=h.date.split("-");
        let hd=new Date(`${yy}-${mm}-${dd}`);

        if(hd<=today) return;

        if(h.type==="GH"&&!nextGH) nextGH=h;
        if(h.type==="RH"&&!nextRH) nextRH=h;
    });

    document.getElementById("nextGH").innerText =
        nextGH ? nextGH.date+" ("+nextGH.name+")" : "-";

    document.getElementById("nextRH").innerText =
        nextRH ? nextRH.date+" ("+nextRH.name+")" : "-";
}

</script>

</body>
</html>
