<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PPU Shift Dashboard</title>

<style>
body { font-family: Arial; margin:0; background:#eef1f5; }

.header {
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:20px 10px;
}

.logo {
    width:50px;
    border-radius:12px;
    border:2px solid white;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
}

.badge {
    display:inline-block;
    background:#c2185b;
    padding:6px 14px;
    border-radius:20px;
    margin:8px 0;
    font-weight:bold;
}

.sub-info { font-size:14px; }

.card {
    background:white;
    margin:12px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.shift-title { font-weight:bold; margin-top:10px; }

.chip {
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    color:white;
    margin:3px;
    font-size:12px;
}

.selected {
    border:2px solid gold;
    box-shadow:0 0 5px gold;
}

.A { background:#8e24aa; }
.B { background:#fb8c00; }
.C { background:#1e88e5; }
.G { background:#e53935; }
.OFF { background:#2e7d32; }

.extra { background:#fdd835; color:black; }

hr { margin:10px 0; }

select, button, input {
    padding:6px;
    margin-top:5px;
}
</style>

</head>

<body>

<div class="header">
    <img src="https://raw.githubusercontent.com/debajitd1292/pp/main/logo.png" class="logo">
    <h2>PPU Shift Schedule</h2>
    <div id="todayDate"></div>

    <div class="badge" id="todayShiftBadge">Loading...</div>

    <div class="sub-info">
        Next GH: <span id="nextGH">-</span> |
        Next RH: <span id="nextRH">-</span>
    </div>
</div>

<div class="card">
    <label>Select Date:</label>
    <input type="date" id="datePicker" onchange="renderSelected()">

    <br><br>

    <label>Your Name:</label>
    <select id="nameSelector" onchange="onNameChange()"></select>

    <br><br>

    <label>Override For:</label>
    <select id="overrideName"></select>

    <br><br>

    <label>Override Shift:</label>
    <select id="shiftOverride">
        <option value="">--None--</option>
        <option>A</option><option>B</option><option>C</option>
        <option>G</option><option>OFF</option>
        <option>D</option><option>N</option>
        <option>L</option><option>T</option>
    </select>

    <button onclick="applyOverride()">Apply</button>
</div>

<div class="card">
    <h3>TODAY</h3>
    <div id="today"></div>
</div>

<div class="card">
    <h3>SELECTED</h3>
    <div id="selected"></div>
</div>

<script>

const shiftUrl = "https://raw.githubusercontent.com/debajitd1292/pp/main/shift.csv";
const holidayUrl = "https://raw.githubusercontent.com/debajitd1292/pp/main/holiday.csv";

let data = [];
let holidays = [];
let selectedName = "";
let overrides = {};

const seniorityOrder = [
"Saiprasad","Abhigyan","Arshad","Sandip","Shashank","Debajit",
"Satadru","Santanu","Arka","Devendra","Kamal","Vijay","Palash",
"Nihal","Sampreeti","Arun","Jitu","Pritam","Hriday"
];

Promise.all([
    fetch(shiftUrl).then(res => res.text()),
    fetch(holidayUrl).then(res => res.text())
])
.then(([shiftText, holidayText]) => {

    data = shiftText.split("\n").map(r =>
        r.replace(/\r/g, "").split(/[,;]/)
    );

    holidays = holidayText.split("\n")
        .slice(1)
        .map(r => {
            let [date, type, name] = r.replace(/\r/g, "").split(/[,;]/);
            return {
                date: date?.trim(),
                type: type?.trim().toUpperCase(),
                name: name?.trim()
            };
        });

    // ✅ SORT HOLIDAYS
    holidays.sort((a, b) => {
        let [d1,m1,y1] = a.date.split("-");
        let [d2,m2,y2] = b.date.split("-");
        return new Date(`${y1}-${m1}-${d1}`) - new Date(`${y2}-${m2}-${d2}`);
    });

    init();
});

function formatDate(date) {
    let d = ("0" + date.getDate()).slice(-2);
    let m = ("0" + (date.getMonth()+1)).slice(-2);
    let y = date.getFullYear();
    return `${d}-${m}-${y}`;
}

function formatPrettyDate(dateStr) {
    const [d, m, y] = dateStr.split("-");
    const date = new Date(`${y}-${m}-${d}`);

    const day = date.getDate();
    const month = date.toLocaleString('en-US', { month: 'short' });

    const suffix = (day % 10 === 1 && day !== 11) ? "st" :
                   (day % 10 === 2 && day !== 12) ? "nd" :
                   (day % 10 === 3 && day !== 13) ? "rd" : "th";

    return `${day}${suffix} ${month}`;
}

function init() {
    const today = new Date();
    const todayStr = formatDate(today);

    document.getElementById("todayDate").innerText = today.toDateString();

    populateNames();

    let myShift = getShiftForName(todayStr, selectedName);

    document.getElementById("todayShiftBadge").innerText =
        "Today Shift: " + (myShift || "No Data");

    render("today", todayStr);
    calculateNextHoliday(todayStr);
}

function populateNames() {

    let nameDropdown = document.getElementById("nameSelector");
    let overrideDropdown = document.getElementById("overrideName");

    nameDropdown.innerHTML = "";
    overrideDropdown.innerHTML = "";

    let names = [];

    for (let i = 1; i < data.length; i++) {
        let name = data[i][0]?.trim();
        if (name) names.push(name);
    }

    names = sortBySeniority(names);

    names.forEach(n => {
        nameDropdown.add(new Option(n, n));
        overrideDropdown.add(new Option(n, n));
    });

    selectedName = nameDropdown.value;
}

function sortBySeniority(names) {
    return names.sort((a, b) => {
        let ia = seniorityOrder.indexOf(a);
        let ib = seniorityOrder.indexOf(b);
        if (ia === -1) ia = 999;
        if (ib === -1) ib = 999;
        return ia - ib;
    });
}

function getShiftForName(dateStr, name) {
    let key = dateStr + "|" + name;
    if (overrides[key]) return overrides[key];

    let header = data[0].map(h => h.trim());
    let col = header.indexOf(dateStr);

    for (let i=1; i<data.length; i++) {
        if (data[i][0]?.trim() === name) {
            return data[i][col]?.trim();
        }
    }
}

function getShiftData(dateStr) {
    let header = data[0].map(h => h.trim());
    let col = header.indexOf(dateStr);
    if (col === -1) return null;

    let shifts = {};

    for (let i=1; i<data.length; i++) {
        let name = data[i][0]?.trim();
        let shift = data[i][col]?.trim();

        let key = dateStr + "|" + name;
        if (overrides[key]) shift = overrides[key];

        if (!shifts[shift]) shifts[shift] = [];
        shifts[shift].push(name);
    }

    return shifts;
}

function render(containerId, dateStr) {
    let container = document.getElementById(containerId);
    container.innerHTML = "";

    let shifts = getShiftData(dateStr);
    if (!shifts) return;

    const main = ["A","B","C","G","OFF"];
    const extra = ["D","N","L","T"];

    main.forEach(s => {
        let names = sortBySeniority(shifts[s] || []);
        container.innerHTML += createBlock(s, names, s);
    });

    let extraHTML = "";
    extra.forEach(s => {
        if (shifts[s]) {
            extraHTML += createBlock(s, sortBySeniority(shifts[s]), "extra");
        }
    });

    if (extraHTML) container.innerHTML += "<hr>" + extraHTML;
}

function createBlock(title, names, cls) {
    let chips = names.map(n => {
        let highlight = (n === selectedName) ? "selected" : "";
        return `<span class="chip ${cls} ${highlight}">${n}</span>`;
    }).join("");

    return `<div class="shift-title">${title} (${names.length})</div>${chips || "-"}`;
}

function onNameChange() {
    selectedName = document.getElementById("nameSelector").value;
    init();
}

function applyOverride() {

    let shift = document.getElementById("shiftOverride").value;
    let name = document.getElementById("overrideName").value;

    if (!shift || !name) return;

    let dateInput = document.getElementById("datePicker").value;
    let dateStr = dateInput ? formatDate(new Date(dateInput)) : formatDate(new Date());

    overrides[dateStr + "|" + name] = shift;

    init();
}

function renderSelected() {
    let val = document.getElementById("datePicker").value;
    if (!val) return;

    let str = formatDate(new Date(val));
    render("selected", str);
}

// ✅ FIXED HOLIDAY LOGIC
function calculateNextHoliday(todayStr) {

    const [d, m, y] = todayStr.split("-");
    const today = new Date(`${y}-${m}-${d}`);

    let nextGH = null;
    let nextRH = null;

    holidays.forEach(h => {

        if (!h.date) return;

        const [dd, mm, yy] = h.date.split("-");
        const hDate = new Date(`${yy}-${mm}-${dd}`);

        if (hDate <= today) return;

        if (h.type === "GH" && !nextGH) nextGH = h;
        if (h.type === "RH" && !nextRH) nextRH = h;
    });

    document.getElementById("nextGH").innerText =
        nextGH ? `${formatPrettyDate(nextGH.date)} (${nextGH.name})` : "-";

    document.getElementById("nextRH").innerText =
        nextRH ? `${formatPrettyDate(nextRH.date)} (${nextRH.name})` : "-";
}

</script>

</body>
</html>
