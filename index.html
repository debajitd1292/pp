<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPU Shift Dashboard</title>

<style>
body {
    font-family: Arial;
    margin:0;
    background:#eef1f5;
}

/* HEADER */
.header {
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:15px 10px;
}

.logo {
    width:50px;
    border-radius:12px;
}

.badge {
    display:inline-block;
    background:#c2185b;
    padding:6px 14px;
    border-radius:20px;
    margin:8px 0;
    font-weight:bold;
}

/* CARD */
.card {
    background:white;
    margin:10px;
    padding:12px;
    border-radius:12px;
}

/* INPUT FIX */
input, select {
    width:100%;
    height:38px;
    padding:6px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

/* SHIFT TITLE */
.shift-title {
    font-weight:bold;
    margin-top:10px;
}

/* CHIPS */
.chip {
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    margin:4px;
    color:white;
    font-size:12px;
}

/* HIGHLIGHT */
.selected {
    border:2px solid gold;
}

/* COLORS (MATCHING YOUR IMAGE) */
.A { background:#8e24aa; }
.B { background:#ff9800; }
.C { background:#1e40ff; }
.G { background:#e53935; }
.OFF { background:#1b5e20; }

.D { background:#43a047; }
.N { background:#212121; }
.L { background:#ffd600; color:black; }
.T { background:#00acc1; color:black; }

</style>
</head>

<body>

<div class="header">
    <img src="https://raw.githubusercontent.com/debajitd1292/pp/main/logo.png" class="logo">
    <h3>PPU Shift Schedule</h3>
    <div id="todayDate"></div>
    <div class="badge" id="todayShiftBadge">Loading...</div>
    <div>
        Next GH: <span id="nextGH"></span> |
        Next RH: <span id="nextRH"></span>
    </div>
</div>

<div class="card">
    <label>Select Date:</label>
    <input type="date" id="datePicker" onchange="renderSelected()">

    <label>Your Name:</label>
    <select id="nameSelector" onchange="onNameChange()"></select>
</div>

<div class="card">
    <h3>TODAY</h3>
    <div id="today"></div>
</div>

<div class="card">
    <h3>SELECTED</h3>
    <div id="selected"></div>
</div>

<script>

const shiftUrl = "https://raw.githubusercontent.com/debajitd1292/pp/main/shift.csv";
const holidayUrl = "https://raw.githubusercontent.com/debajitd1292/pp/main/holiday.csv";

let data = [];
let holidays = [];
let selectedName = "";

// SENIORITY
const seniorityOrder = [
"Saiprasad","Abhigyan","Arshad","Sandip","Shashank","Debajit",
"Satadru","Santanu","Arka","Devendra","Kamal","Vijay","Palash",
"Nihal","Sampreeti","Arun","Jitu","Pritam","Hriday"
];

// LABELS
const shiftLabels = {
"A":"A Shift","B":"B Shift","C":"C Shift",
"G":"General","OFF":"Rest/Off",
"D":"Day Duty","N":"Night Duty","L":"Leave","T":"Training"
};

// LOAD
Promise.all([
fetch(shiftUrl).then(r=>r.text()),
fetch(holidayUrl).then(r=>r.text())
]).then(([shiftText,holidayText])=>{

data = shiftText.split("\n").map(r=>r.replace(/\r/g,"").split(/[,;]/));

holidays = holidayText.split("\n").slice(1).map(r=>{
let [d,t,n]=r.replace(/\r/g,"").split(/[,;]/);
return {date:d?.trim(),type:t?.trim(),name:n?.trim()};
});

init();
});

function formatDate(d){
return ("0"+d.getDate()).slice(-2)+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+d.getFullYear();
}

function init(){
document.getElementById("todayDate").innerText=new Date().toDateString();
populateNames();
refresh();
calcHoliday();
}

function populateNames(){
let sel=document.getElementById("nameSelector");
let names=[];
for(let i=1;i<data.length;i++){
let n=data[i][0]?.trim();
if(n) names.push(n);
}
names=names.sort((a,b)=>seniorityOrder.indexOf(a)-seniorityOrder.indexOf(b));
names.forEach(n=>sel.add(new Option(n,n)));
selectedName=sel.value;
}

function refresh(){
let today=formatDate(new Date());
document.getElementById("todayShiftBadge").innerText=
"Today Shift: "+getShift(today,selectedName);
render("today",today);
}

function getShift(date,name){
let header=data[0];
let col=header.indexOf(date);
for(let i=1;i<data.length;i++){
if(data[i][0]===name) return data[i][col];
}
}

function getData(date){
let header=data[0];
let col=header.indexOf(date);
let shifts={};

for(let i=1;i<data.length;i++){
let name=data[i][0];
let shift=data[i][col];
if(!shift) continue;

shift.split("").forEach(s=>{
if(!shifts[s]) shifts[s]=[];
shifts[s].push(name);
});
}
return shifts;
}

function render(id,date){
let box=document.getElementById(id);
box.innerHTML="";

let shifts=getData(date);

["A","B","C","G","OFF","D","N","L","T"].forEach(s=>{
let list=shifts[s]||[];
list=list.sort((a,b)=>seniorityOrder.indexOf(a)-seniorityOrder.indexOf(b));

let alert=(["A","B","C"].includes(s)&&list.length<=2)?" ❗":"";

let chips=list.map(n=>{
let sel=(n===selectedName)?"selected":"";
return `<span class="chip ${s} ${sel}">${n}</span>`;
}).join("");

box.innerHTML+=`<div class="shift-title">${shiftLabels[s]} (${list.length})${alert}</div>${chips||"-"}`;
});
}

function onNameChange(){
selectedName=document.getElementById("nameSelector").value;
refresh();
}

function renderSelected(){
let val=document.getElementById("datePicker").value;
if(!val) return;
let d=new Date(val);
render("selected",formatDate(d));
}

function calcHoliday(){
if(!holidays.length) return;
document.getElementById("nextGH").innerText=holidays[0]?.date;
document.getElementById("nextRH").innerText=holidays[1]?.date;
}

</script>

</body>
</html>
